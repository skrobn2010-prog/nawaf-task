<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Pro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>📋 Task Pro</h1>
    <p class="designer">✦ المصمم نواف فهد الشمري ✦</p>
    <p>نظم مهامك بسهولة</p>

    <div class="task-box">
        <input id="taskInput" type="text" placeholder="اكتب مهمتك هنا">
        <button onclick="addTask()">إضافة</button>
    </div>

    <ul id="taskList"></ul>

    <h3 id="progress">إنجاز المهام: 0%</h3>

</div>

<script src="script.js"></script>

</body>

</html>
